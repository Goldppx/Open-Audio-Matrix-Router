name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  web:
    name: Web UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  core:
    name: Core and pairing (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-ci -DOAMR_ENABLE_GSTREAMER=OFF -DOAMR_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci --config Release --parallel
      - name: Test
        run: ctest --test-dir build-ci -C Release --output-on-failure

# GStreamer integration and portable-package validation intentionally remain
# outside hosted CI: the application needs the Windows MSVC GStreamer runtime
# and audio hardware. They can run on a self-hosted Windows runner later.
